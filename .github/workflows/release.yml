name: Release

# İmzalı APK ve Play için AAB üretimi. `v*` etiketi push'lanınca çalışır, APK'yı
# GitHub Release'e `reyon.apk` adıyla ekler; Pages sitesindeki indirme bağlantısı
# releases/latest/download/reyon.apk adresinden her zaman en yeni sürümü verir.
#
# Gerekli secret'lar (depo sahibi ayarlar):
#   ANDROID_KEYSTORE_BASE64   — base64 kodlu reyon-release.jks
#   ANDROID_KEYSTORE_PASSWORD — keystore parolası (alias: reyon)

on:
  push:
    tags: ['v*']
    # İş akışı değişince imzalı derlemeyi doğrula (Release oluşturmaz).
    branches: [main, 'claude/**']
    paths: ['.github/workflows/release.yml']
  # Elle tetikleme: verilen etiketi ve Release'i iş akışı kendisi oluşturur.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Oluşturulacak sürüm etiketi (örn. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Motor birim testleri
        run: ./gradlew :engine:test

      - name: Arayüz testleri (Robolectric + Compose)
        run: ./gradlew :app:testDebugUnitTest

      - name: Sürümü etiketten türet
        id: version
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          case "$TAG" in
            v[0-9]*) ;;
            *) TAG="v0.0.1" ;; # dal push'u = yalnızca doğrulama derlemesi
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Secret yoksa dosya hiç yazılmaz ve yol boş geçer. Eski hâli `echo "" |
      # base64 -d` ile sıfır baytlık bir .jks yazıyordu: AGP böyle bir
      # yapılandırmayı imzaya hazır saymaz, uyarıp imzasız APK üretir ve koşum
      # yeşil döner. Etiketli koşumda secret eksikse adım burada durur —
      # imzasız sürüm yayımlanmaz.
      - name: Keystore'u çöz
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASING: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            if [ "$RELEASING" = 'true' ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 ve ANDROID_KEYSTORE_PASSWORD secret'ları gerekli; imzasız sürüm yayımlanmaz."
              exit 1
            fi
            echo "Keystore secret'ı yok: dal koşumu imzasız derlemeyle doğrulanacak."
            echo 'path=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/reyon-release.jks"
          if [ ! -s "$RUNNER_TEMP/reyon-release.jks" ]; then
            echo "::error::Çözülen keystore boş; ANDROID_KEYSTORE_BASE64 bozuk."
            exit 1
          fi
          echo "path=$RUNNER_TEMP/reyon-release.jks" >> "$GITHUB_OUTPUT"

      - name: İmzalı release APK ve AAB derle
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PappVersion=${{ steps.version.outputs.version }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # İmza gerçekten APK'ya indi mi? Yapılandırma eksikse AGP imzalamayı
      # sessizce atlar, yani "derleme başarılı" imzayı göstermez. Etiketli
      # koşumda imzasızlık hata; dal koşumunda yalnızca uyarı, çünkü orada
      # keystore zaten yok. Parmak izi de burada kütüğe basılır.
      - name: APK imzasını doğrula
        env:
          RELEASING: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner bulunamadı; imza doğrulanamıyor."
            exit 1
          fi
          if "$APKSIGNER" verify --verbose --print-certs "$APK"; then
            echo "APK imzalı."
          elif [ "$RELEASING" = 'true' ]; then
            echo "::error::APK imzasız; sürüm yayımlanmayacak."
            exit 1
          else
            echo "::warning::APK imzasız — keystore secret'ı olmayan dal koşumunda beklenen."
          fi

      - name: Yayın dosyalarını hazırla (APK + AAB + kaynak arşivleri + SHA256)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/reyon-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/reyon.apk
          # Play Console'a yüklenen paket; yandan kurulamaz, APK onun için.
          cp app/build/outputs/bundle/release/app-release.aab "dist/reyon-$TAG-play.aab"
          git archive --format=zip --prefix="reyon-$TAG/" -o "dist/reyon-$TAG-source.zip" HEAD
          git archive --format=tar.gz --prefix="reyon-$TAG/" -o "dist/reyon-$TAG-source.tar.gz" HEAD
          cd dist && sha256sum reyon* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Yayın dosyalarını iş akışı çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: reyon-release-${{ steps.version.outputs.tag }}
          path: dist/*

      - name: GitHub Release oluştur
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
